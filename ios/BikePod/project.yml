name: BikePod
options:
  bundleIdPrefix: com.sachinrajput
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Ferrostar:
    url: https://github.com/stadiamaps/ferrostar
    exactVersion: 0.57.0
  MapLibreSwiftUI:            # same versions Ferrostar 0.57.0 resolves to
    url: https://github.com/maplibre/swiftui-dsl
    exactVersion: 0.25.0
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution.git
    exactVersion: 6.31.0

targets:
  BikePod:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      - Shared
    dependencies:
      - target: BikePodWidgets        # the Live Activity (lock screen, Dynamic Island)
      - package: Ferrostar
        product: FerrostarCore
      - package: Ferrostar
        product: FerrostarMapLibreUI
      - package: Ferrostar
        product: FerrostarSwiftUI
      - package: MapLibreSwiftUI
        product: MapLibreSwiftUI
      - package: MapLibreSwiftUI
        product: MapLibreSwiftDSL
      - package: MapLibre
        product: MapLibre
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: BikePod
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: BikePod uses Bluetooth to send turn directions to your handlebar display.
        NSLocationWhenInUseUsageDescription: BikePod uses your location to guide you along the route.
        UIBackgroundModes: [bluetooth-central, location]
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sachinrajput.bikepod
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ${APPLE_DEVELOPER_TEAM_ID}

  BikePodWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: BikePod
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sachinrajput.bikepod.widgets
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ${APPLE_DEVELOPER_TEAM_ID}
        SKIP_INSTALL: YES
