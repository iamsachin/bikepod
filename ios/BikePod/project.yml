name: BikePod
options:
  bundleIdPrefix: com.sachinrajput
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  BikePod:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: BikePod
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: BikePod uses Bluetooth to send turn directions to your handlebar display.
        UIBackgroundModes: [bluetooth-central]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sachinrajput.bikepod
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ${APPLE_DEVELOPER_TEAM_ID}
